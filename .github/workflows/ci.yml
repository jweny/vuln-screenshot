name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and Linux dependencies
        if: runner.os == 'Linux'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium
        if: runner.os == 'macOS'
        run: npx playwright install chromium

      - name: Type-check
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify CLI entry point
        run: node dist/cli.js --help

      - name: Verify npm package contents
        shell: bash
        run: |
          package_file="$(npm pack --silent)"
          test -f "$package_file"
          package_files="$(tar -tf "$package_file")"
          printf '%s\n' "$package_files"
          if printf '%s\n' "$package_files" | grep -Eq '^package/(artifacts|tests|src|design-qa\.md)(/|$)'; then
            echo 'Unexpected development or evidence files in npm package' >&2
            exit 1
          fi
          rm "$package_file"
